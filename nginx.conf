# Main Nginx config for an unprivileged Nginx. The site block is upstream's
# deploy/standalone/nginx.conf with the port and upstream address adapted.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  # Railway's edge proxy appends the client address to X-Forwarded-For, so the
  # last entry is the real client (used for sign-in rate limits).
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;
  include /tmp/nginx/site.conf;
}
